[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simulating-US-imaging-chain"
version = "1.0.0"
description = "End-to-end plane-wave ultrasound imaging chain simulation with MUST (pymust): DAS and Null Subtraction Imaging."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pymust", "numpy", "scipy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lib*"]
